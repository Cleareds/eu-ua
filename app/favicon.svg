<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Blue background -->
  <circle cx="16" cy="16" r="16" fill="#003399"/>

  <!-- 12 EU stars arranged in a circle, radius=10 -->
  <g fill="#FFD700">
    <!-- Each star: 5-pointed, size ~2.2px, on circle r=10 from center 16,16 -->
    <!-- 0° top -->
    <polygon points="16,5 16.47,6.45 17.98,6.45 16.76,7.34 17.22,8.79 16,7.9 14.78,8.79 15.24,7.34 14.02,6.45 15.53,6.45"/>
    <!-- 30° -->
    <polygon points="21,6.34 21.47,7.79 22.98,7.79 21.76,8.68 22.22,10.13 21,9.24 19.78,10.13 20.24,8.68 19.02,7.79 20.53,7.79" transform="rotate(30,16,16) translate(0,0)"/>
    <!-- Using transform approach for all 12 stars -->
  </g>

  <!-- Simpler: 12 small 5pt stars using transform rotate -->
  <g fill="#FFD700">
    <g transform="rotate(0 16 16)">  <polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(30 16 16)"> <polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(60 16 16)"> <polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(90 16 16)"> <polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(120 16 16)"><polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(150 16 16)"><polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(180 16 16)"><polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(210 16 16)"><polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(240 16 16)"><polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(270 16 16)"><polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(300 16 16)"><polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
    <g transform="rotate(330 16 16)"><polygon points="16,5.8 16.35,6.9 17.5,6.9 16.57,7.58 16.91,8.68 16,8 15.09,8.68 15.43,7.58 14.5,6.9 15.65,6.9"/></g>
  </g>

  <!-- UA text in the centre -->
  <text x="16" y="20.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="7.5" fill="#FFD700" letter-spacing="0.5">UA</text>
</svg>
